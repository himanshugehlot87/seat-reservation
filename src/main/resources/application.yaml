spring:
  application:
    name: SeatReservation

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
    port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: '{
    "timestamp": "%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}",
    "level": "%level",
    "correlationId": "%X{X-Correlation-ID}",
    "logger": "%logger{36}",
    "message": "%msg"
}%n'